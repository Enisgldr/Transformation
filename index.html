<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana Bir Sorum Var 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff0f5, #ffe0eb);
}

.heart {
    position: absolute;
    color: #f3a1bd;
    opacity: 0.6;
    animation: float 6s infinite ease-in-out;
    pointer-events: none;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-25px) rotate(12deg); }
}

.card {
    width: 90%;
    max-width: 390px;
    padding: 38px 22px;
    text-align: center;
    background: rgba(255,255,255,0.85);
    border: 1px solid #ffd0df;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(220, 100, 145, 0.15);
    z-index: 2;
}

.emoji {
    font-size: 55px;
    margin-bottom: 12px;
}

h1 {
    color: #cf5c89;
    font-size: 27px;
    margin: 10px 0;
}

p {
    color: #986779;
    font-size: 16px;
    margin-bottom: 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    min-height: 65px;
}

button {
    border: none;
    border-radius: 14px;
    padding: 13px 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.25s ease;
}

#yes {
    background: #e879a4;
    color: white;
    box-shadow: 0 5px 15px #e879a444;
}

#no {
    background: #f7e5ec;
    color: #a45d78;
}

#success {
    display: none;
    color: #cf5c89;
    font-size: 23px;
    line-height: 1.6;
    margin-top: 20px;
}

</style>
</head>

<body>

<div class="heart" style="top:10%;left:12%;font-size:28px;">♡</div>
<div class="heart" style="top:20%;right:12%;font-size:35px;">♥</div>
<div class="heart" style="bottom:15%;left:15%;font-size:30px;">♡</div>
<div class="heart" style="bottom:12%;right:15%;font-size:25px;">♥</div>

<div class="card">
    <div class="emoji" id="emoji">☕💗</div>

    <h1 id="title">Sana bir sorum var...</h1>
    <p id="question">Benimle kahve içelim mi? 🌸</p>

    <div class="buttons" id="buttons">
        <button id="yes" onclick="accept()">Evet 💗</button>
        <button id="no" onclick="decline()">Hayır 🙈</button>
    </div>

    <div id="success">
        Yaşasııın! 💕🥹<br>
        O zaman kahveler benden! ☕<br>
        <span style="font-size:17px;">Güzel bir gün bizi bekliyor 💖</span>
    </div>
</div>

<script>
let yesSize = 16;
let noSize = 16;
let noCount = 0;

function decline() {
    noCount++;

    yesSize = Math.min(yesSize + 7, 65);
    noSize = Math.max(noSize - 2, 7);

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");

    yes.style.fontSize = yesSize + "px";
    yes.style.padding = (13 + noCount * 2) + "px " +
                        (24 + noCount * 3) + "px";

    no.style.fontSize = noSize + "px";
    no.style.padding = Math.max(3, 13 - noCount) + "px " +
                       Math.max(4, 24 - noCount * 2) + "px";

    const messages = [
        "Emin misin? 🥺💗",
        "Bir kahve sadece... ☕",
        "Son kararın mı? 🥹",
        "Evet desen ne güzel olurdu 💕",
        "Hayır butonu küçülüyor 🙈"
    ];

    document.getElementById("question").textContent =
        messages[(noCount - 1) % messages.length];
}

function accept() {
    document.getElementById("emoji").textContent = "🥹💖";
    document.getElementById("title").textContent = "Gerçekten mi?!";
    document.getElementById("question").style.display = "none";
    document.getElementById("buttons").style.display = "none";
    document.getElementById("success").style.display = "block";

    // Konfeti efekti
    const colors = ["#ff75a0", "#ffb6c9", "#ffd166",
                    "#ffffff", "#e879a4", "#c8a2ff"];

    for (let i = 0; i < 150; i++) {
        const confetti = document.createElement("div");

        confetti.style.position = "fixed";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-20px";
        confetti.style.width = (Math.random() * 8 + 5) + "px";
        confetti.style.height = (Math.random() * 8 + 5) + "px";
        confetti.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        confetti.style.zIndex = "10";
        confetti.style.pointerEvents = "none";

        document.body.appendChild(confetti);

        const duration = Math.random() * 2500 + 2000;
        const drift = (Math.random() - 0.5) * 300;

        confetti.animate([
            { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
            { transform: `translate(${drift}px, 110vh) rotate(900deg)`,
              opacity: 0.8 }
        ], {
            duration: duration,
            easing: "ease-in",
            fill: "forwards"
        });

        setTimeout(() => confetti.remove(), duration + 100);
    }
}
</script>

</body>
</html>
